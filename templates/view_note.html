<!-- templates/view_note.html -->
<!DOCTYPE html>
<html>
<head>
  <title>View Secure Note</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f4f4f4;
      text-align: center;
      padding: 50px;
    }
    .note-box {
      background-color: #222;
      border-radius: 10px;
      padding: 20px;
      margin: auto;
      width: 70%;
      font-size: 18px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <h1>🔐 Your Secure Note</h1>
  <div class="note-box">
    {{ note }}
  </div>
</body>
</html>
